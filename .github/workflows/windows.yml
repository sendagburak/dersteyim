name: Windows derleme
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Sunucu bağımlılıkları
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Arayüz bağımlılıkları
        run: npm ci --prefix client --no-audit --no-fund
      - name: Test ve arayüz derleme
        run: |
          npm run build
          npm test
      - name: Node çalışma ortamını pakete ekle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-Command node.exe).Source bin/node.exe
      - name: Masaüstü bağımlılıkları
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Windows kurulum ve taşınabilir EXE
        run: npm --prefix desktop run dist
      - name: Paketlenmiş EXE ile örnek kurulum ve yoklama testi
        run: node scripts/windows-package-smoke.cjs dist_installer/win-unpacked/VarYok.exe
      - name: Taşınabilir EXE ile örnek kurulum ve yoklama testi
        run: node scripts/windows-package-smoke.cjs dist_installer/VarYok-Tasinabilir-1.3.1-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VarYok-Windows-x64
          path: dist_installer/*.exe
          if-no-files-found: error
