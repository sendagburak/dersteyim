name: Windows derleme
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Sunucu bağımlılıkları
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Arayüz bağımlılıkları
        run: npm ci --prefix client --no-audit --no-fund
      - name: Test ve arayüz derleme
        run: |
          npm run build
          npm test
      - name: Node çalışma ortamını pakete ekle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-Command node.exe).Source bin/node.exe
      - name: Masaüstü bağımlılıkları
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Electron penceresini ve kaydedilmemiş değişiklik uyarısını test et
        run: node scripts/windows-electron-close-smoke.cjs
      - name: Windows kurulum ve taşınabilir EXE
        run: npm --prefix desktop run dist
      - name: Paketlenmiş EXE ile örnek kurulum ve yoklama testi
        run: node scripts/windows-package-smoke.cjs dist_installer/win-unpacked/VarYok.exe --verify-close
      - name: Taşınabilir EXE ile örnek kurulum ve yoklama testi
        run: node scripts/windows-package-smoke.cjs dist_installer/VarYok-Tasinabilir-1.3.3-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VarYok-Windows-x64
          path: dist_installer/*.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VarYok-Windows-x64
          path: dist_installer
      - name: Test edilen EXE dosyalarını deneme sürümü olarak yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version zaten mevcut; dosyalar değiştirilmedi."
            exit 0
          fi
          gh release create "v$version" dist_installer/*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "VarYok $version (Deneme)" --notes "Bu deneme sürümünde ders saatlerinin durumları ayrı düzenlenir ve kaydedilmemiş yoklama varken kapanış onayı gösterilir. Önceden yanlış kaydedilmiş yoklamaları kontrol edin. Gerçek okul ortamında kullanmadan önce kurulum, güvenlik ve hukuki değerlendirmeleri tamamlayın."
